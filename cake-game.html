<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخبز الأميرات السحري | لعبة أختي الصغرى</title>
    <style>
        :root {
            --bg-color: #1a102f;
            --card-bg: #2d1b4e;
            --accent-color: #ff758c;
            --secondary-color: #ff7eb3;
            --text-color: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-color), #431f4f);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 3px solid var(--accent-color);
            text-align: center;
        }

        h1 {
            color: var(--secondary-color);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 1rem;
            font-weight: bold;
        }

        .stat-item span {
            color: #ffd700;
        }

        /* منطقة تجهيز الكيك الواقعية والمرئية */
        .kitchen-board {
            background: #fff;
            color: #333;
            border-radius: 15px;
            padding: 15px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            margin-bottom: 15px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }

        .customer-order {
            font-size: 1.05rem;
            font-weight: bold;
            color: #d63384;
        }

        /* حاوية الكيك المتراكم لتغيير الشكل بالواقع */
        .cake-assembly {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        .layer {
            font-size: 2.2rem;
            animation: popIn 0.3s ease-in-out;
            margin-top: -15px;
        }

        .layer:first-child {
            margin-top: 0;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .default-cake-icon {
            font-size: 3.5rem;
            color: #ccc;
        }

        /* أزرار المكونات */
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .ingredient-btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.4);
        }

        .ingredient-btn:active {
            transform: scale(0.95);
        }

        .start-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .message {
            font-size: 0.9rem;
            min-height: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🎂 مخبز الأميرات السحري 👑</h1>
        <p style="font-size: 0.8rem; color: #d1c4e9;">زيني الكيكة خطوة بخطوة وأسعدي أميرتك الصغيرة!</p>

        <div class="stats-bar">
            <div class="stat-item">النقاط: <span id="score">0</span> 🌟</div>
            <div class="stat-item">الوقت: <span id="timer">35</span> ثانية ⏱️</div>
        </div>

        <div class="kitchen-board">
            <div class="customer-order" id="orderText">اضغطي ابدأ اللعبة لتلقي الطلب!</div>
            
            <!-- شكل الكيك التفاعلي -->
            <div class="cake-assembly" id="cakeAssembly">
                <div class="default-cake-icon" id="basePlaceholder">🥮</div>
            </div>

            <div class="message" id="gameMsg">جاهزة للبدء...</div>
        </div>

        <div class="ingredients-grid" id="controlsGrid" style="display: none;">
            <button class="ingredient-btn" onclick="addIngredient('قاعدة كيك', '🍞')">🍞 كيك</button>
            <button class="ingredient-btn" onclick="addIngredient('شوكولاتة', '🍫')">🍫 شوكولاتة</button>
            <button class="ingredient-btn" onclick="addIngredient('فراولة', '🍓')">🍓 فراولة</button>
            <button class="ingredient-btn" onclick="addIngredient('كريمة', '🧁')">🧁 كريمة</button>
            <button class="ingredient-btn" onclick="addIngredient('شموع', '🕯️')">🕯️ شموع</button>
            <button class="ingredient-btn" onclick="serveOrder()" style="background: linear-gradient(135deg, #ffc107, #ff9800);">🚀 تقديم</button>
        </div>

        <button class="start-btn" id="startBtn" onclick="startGame()">ابدأ اللعبة الآن! 🎮</button>
    </div>

    <script>
        let score = 0;
        let timeLeft = 35;
        let gameInterval;
        let targetRecipe = null;
        let playerSelectionNames = [];
        let playerSelectionIcons = [];

        const recipes = [
            { name: "كيك شوكولاتة بالفراولة", items: ["قاعدة كيك", "شوكولاتة", "فراولة"] },
            { name: "تورته كريمة بالشموع", items: ["قاعدة كيك", "كريمة", "شموع"] },
            { name: "كيك فاخر بالكريمة والفراولة", items: ["قاعدة كيك", "كريمة", "فراولة"] }
        ];

        function startGame() {
            score = 0;
            timeLeft = 35;
            document.getElementById("score").innerText = score;
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("controlsGrid").style.display = "grid";
            
            nextOrder();
            
            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    endGame();
                }
            }, 1000);
        }

        function nextOrder() {
            playerSelectionNames = [];
            playerSelectionIcons = [];
            
            // اختيار وصفة عشوائية جديدة تماماً في كل مرة
            targetRecipe = recipes[Math.floor(Math.random() * recipes.length)];
            document.getElementById("orderText").innerText = "الطلب المطلوب: " + targetRecipe.name;
            document.getElementById("gameMsg").innerText = "أضيفي المكونات بالترتيب الظاهر في الطلب!";
            document.getElementById("gameMsg").style.color = "#333";
            
            updateCakeVisual();
        }

        function addIngredient(name, icon) {
            if (timeLeft <= 0) return;
            
            playerSelectionNames.push(name);
            playerSelectionIcons.push(icon);
            
            updateCakeVisual();
            document.getElementById("gameMsg").innerText = "تمت إضافة: " + name;
        }

        function updateCakeVisual() {
            const assembly = document.getElementById("cakeAssembly");
            assembly.innerHTML = "";

            if (playerSelectionIcons.length === 0) {
                assembly.innerHTML = '<div class="default-cake-icon">🥮</div>';
                return;
            }

            // عرض كل طبقة مكون اختارته البطلة فوق بعضه
            playerSelectionIcons.forEach(icon => {
                const layerDiv = document.createElement("div");
                layerDiv.className = "layer";
                layerDiv.innerText = icon;
                assembly.appendChild(layerDiv);
            });
        }

        function serveOrder() {
            if (timeLeft <= 0) return;
            
            let isMatch = targetRecipe.items.length === playerSelectionNames.length &&
                          targetRecipe.items.every((val, index) => val === playerSelectionNames[index]);

            if (isMatch) {
                score += 10;
                document.getElementById("score").innerText = score;
                document.getElementById("gameMsg").innerText = "رائع جداً! طلب صحيح وممتاز 🌟";
                document.getElementById("gameMsg").style.color = "green";
                setTimeout(nextOrder, 1200);
            } else {
                document.getElementById("gameMsg").innerText = "خطأ في المكونات أو الترتيب! أعيدي المحاولة ❌";
                document.getElementById("gameMsg").style.color = "red";
                // إعادة تعيين طبقات الكيك لتتغير وجاهزة للتجربة الجديدة
                playerSelectionNames = [];
                playerSelectionIcons = [];
                updateCakeVisual();
            }
        }

        function endGame() {
            document.getElementById("controlsGrid").style.display = "none";
            document.getElementById("startBtn").style.display = "block";
            document.getElementById("startBtn").innerText = "العب مرة أخرى! 🔄";
            document.getElementById("orderText").innerText = "انتهى الوقت يا بطلة!";
            
            const assembly = document.getElementById("cakeAssembly");
            assembly.innerHTML = '<div class="default-cake-icon">🏆</div>';
            
            document.getElementById("gameMsg").innerText = "النتيجة النهائية: " + score + " نقطة! أداء عظيم!";
        }
    </script>
</body>
</html>
