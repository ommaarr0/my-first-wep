<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الزرار الهارب</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* عشان الزرار ميطلعش بره حدود الشاشة ويعمل سكرول */
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* الزرار هيكون Absolute عشان نقريك نغير مكانه بحرية في الشاشة */
        #runawayBtn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            position: absolute;
            transition: 0.15s ease-out; /* حركة سريعة وناعمة */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تحدي الذكاء! 😈
