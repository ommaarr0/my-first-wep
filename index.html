<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الزرار الهارب</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 40px;
        }

        #runawayBtn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            position: absolute;
            transition: all 0.1s ease-out;
        }
    </style>
</head>
<body>

    <h1>تحدي الذكاء! 😈</h1>
    <p>لو تقدر، اضغط على الزرار ده واثبت إنك أذكى من الموقع!</p>

    <button id="runawayBtn">اضغط هنا لو تقدر!</button>

    <script>
        const btn = document.getElementById('runawayBtn');

        function moveButton() {
            // حساب المساحة المتاحة للشاشة بالموبايل
            const padding = 30;
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;

            // توليد أماكن عشوائية بس جوه حدود الشاشة تماماً
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(150, Math.floor(Math.random() * maxY)); // 150 عشان مايدخلش في الكلام اللي فوق

            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        // أول ما الماوس يقرب أو الشاشة تتلمس، يهرب فوراً
        btn.addEventListener('mouseover', moveButton);
        btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveButton();
        });
    </script>

</body>
</html>
